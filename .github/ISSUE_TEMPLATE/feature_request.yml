name: Предложение
description: Новая возможность или улучшение интерфейса
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Какую задачу нужно решить?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Предлагаемое поведение
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Альтернативы и дополнительные сведения
